apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - name: http
      port: 3003
      targetPort: 3003
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: student-service
spec:
  type: ClusterIP
  selector:
    app: student-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
